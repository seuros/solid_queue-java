name: Test solid_queue on Java

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - jruby-head
          - truffleruby-head

    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test
        env:
          TARGET_DB: sqlite
